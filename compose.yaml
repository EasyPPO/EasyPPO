services:
  easyppo:
    image: ${EASYPPO_IMAGE:-ghcr.io/easyppo/easyppo-b200:20261110@sha256:a461595356a041e8af18aa0d4514b2ecd28de1e824d349c9ca8667760270b091}
    working_dir: /workspace/EasyPPO
    volumes:
      - type: bind
        source: .
        target: /workspace/EasyPPO
    environment:
      PYTHONPATH: /workspace/EasyPPO
      PYTHONDONTWRITEBYTECODE: "1"
    shm_size: 16gb
    entrypoint: []
    command: ["python3", "scripts/check_environment.py"]
