services:
  easyppo:
    image: ${EASYPPO_IMAGE:-ghcr.io/easyppo/easyppo-b200:20261110}
    working_dir: /workspace/EasyPPO
    volumes:
      - type: bind
        source: .
        target: /workspace/EasyPPO
    environment:
      PYTHONPATH: /workspace/EasyPPO
      PYTHONDONTWRITEBYTECODE: "1"
    shm_size: 16gb
    entrypoint: []
    command: ["python3", "scripts/check_environment.py"]
