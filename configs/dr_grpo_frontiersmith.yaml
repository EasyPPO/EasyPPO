# FrontierSmith Dr. GRPO. Actor mini-batch: 16 prompts * 32 responses = 512 responses.
defaults:
  - ppo_trainer
  - _self_

hydra:
  searchpath:
    - pkg://verl.trainer.config

algorithm:
  adv_estimator: grpo
  norm_adv_by_std_in_grpo: false
  use_kl_in_reward: false

data:
  train_files: ["${oc.env:TRAIN_DATA,data/frontiercs/train_synthetic_200.parquet}"]
  val_files: ["${oc.env:VAL_DATA,data/frontiercs/frontiercs_val.parquet}"]
  train_batch_size: 16
  max_prompt_length: 8192
  max_response_length: 32768
  filter_overlong_prompts: true
  filter_overlong_responses: true
  truncation: left
  prompt_key: prompt
  shuffle: true
  validation_shuffle: false

actor_rollout_ref:
  model:
    path: ${oc.env:MODEL_PATH,HuanzhiMao/Qwen3.5-9B-FrontierCS-SFT-DSv3.1}
    use_remove_padding: true
    enable_gradient_checkpointing: true
    override_config:
      attn_implementation: sdpa
  actor:
    ppo_mini_batch_size: 16
    ppo_micro_batch_size_per_gpu: 1
    ppo_epochs: 1
    shuffle: false
    use_dynamic_bsz: true
    ppo_max_token_len_per_gpu: 40960
    clip_ratio: 0.2
    clip_ratio_low: 0.2
    clip_ratio_high: 0.28
    clip_ratio_c: 3.0
    loss_agg_mode: seq-mean-token-sum-norm
    loss_scale_factor: ${data.max_response_length}
    entropy_coeff: 0.0
    use_kl_loss: false
    kl_loss_coef: 0.001
    kl_loss_type: low_var_kl
    grad_clip: 1.0
    optim:
      lr: 1.0e-6
      lr_warmup_steps: 0
      lr_scheduler_type: constant
      weight_decay: 0.01
      betas: [0.9, 0.999]
      clip_grad: 1.0
    fsdp_config:
      param_offload: true
      optimizer_offload: true
      fsdp_size: 8
  rollout:
    name: vllm
    tensor_model_parallel_size: 1
    n: 32
    temperature: 1.0
    top_p: 1.0
    top_k: -1
    log_prob_micro_batch_size_per_gpu: 1
    log_prob_use_dynamic_bsz: true
    log_prob_max_token_len_per_gpu: 40960
    max_model_len: 40960
    max_num_batched_tokens: 32768
    enable_chunked_prefill: true
    enforce_eager: false
    gpu_memory_utilization: 0.60
    checkpoint_engine:
      update_weights_bucket_megabytes: 8192
    engine_kwargs:
      vllm:
        attention_backend: FLASH_ATTN
        gdn_prefill_backend: triton
        compilation_config:
          cudagraph_mode: FULL_AND_PIECEWISE
    val_kwargs:
      n: 5
      do_sample: true
      temperature: 1.0
      top_p: 1.0
      top_k: -1
  ref:
    log_prob_micro_batch_size_per_gpu: 1
    log_prob_use_dynamic_bsz: true
    log_prob_max_token_len_per_gpu: 40960
    fsdp_config:
      param_offload: true
      fsdp_size: 8

critic:
  enable: false

reward:
  custom_reward_function:
    path: verl/utils/reward_score/frontiercs.py
    name: compute_score
    reward_kwargs:
      # Use a host reachable from every reward worker for multi-node runs.
      judge_url: http://127.0.0.1:8082
  reward_manager:
    name: naive
  num_workers: 8

trainer:
  use_v1: true
  v1:
    trainer_mode: sync
  critic_warmup: 0
  logger: [console]
  project_name: EasyPPO
  experiment_name: EasyPPO-Frontier-DrGRPO
  default_local_dir: ${oc.env:OUTPUT_DIR,outputs/EasyPPO-Frontier-DrGRPO}/checkpoints
  rollout_data_dir: ${oc.env:OUTPUT_DIR,outputs/EasyPPO-Frontier-DrGRPO}/rollouts
  validation_data_dir: ${oc.env:OUTPUT_DIR,outputs/EasyPPO-Frontier-DrGRPO}/validation
  n_gpus_per_node: 8
  nnodes: 1
  val_before_train: true
  total_epochs: 100
  total_training_steps: 240
  resume_mode: auto
  save_freq: 10
  max_actor_ckpt_to_keep: 2
  test_freq: 5
  ray_wait_register_center_timeout: 600
